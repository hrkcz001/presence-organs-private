name: browser
version: "1.0.0"
author: "community"
description: "Third-party Playwright headless browser navigation and extraction organ"
source:
  type: "git"
  url: "https://github.com/presence-community/organ-browser"
  tag: "v1.0.0"
entrypoint: "browser.ts"
type: "typescript"
tools:
  - name: browser_navigate
    description: "Navigate to a web URL and extract page DOM text content"
    parameters:
      type: object
      properties:
        url:
          type: string
          description: "Target URL to navigate to"
      required: ["url"]
  - name: browser_screenshot
    description: "Capture PNG screenshot of the web page"
    parameters:
      type: object
      properties:
        output_file:
          type: string
          description: "File path to save screenshot"
      required: ["output_file"]
permissions:
  allow_network: ["*"]
  timeout_seconds: 30