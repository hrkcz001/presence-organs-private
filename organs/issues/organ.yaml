name: issues
version: "0.3.0"
summary: Autonomous bug, UX friction, and GitHub telemetry reporting organ for Presence Alpha/Beta
manual: MANUAL.md
entrypoint:
  windows: organ-issues.exe
  linux: organ-issues
  macos: organ-issues

instructions: |
  ALPHA/BETA EVALUATION MODE: The system is running in an active development and evaluation phase.
  You MUST actively capture and log any operational friction, tool failure, schema mismatch, confusing
  output, or capability gap using `report_issue` or `log_friction`.
  Do NOT silently paper over or conceal system errors; document them immediately to aid debugging.

tools:
  - name: report_issue
    description: Record a structured bug or friction report locally in markdown and optionally export to GitHub Issues.
    parameters:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: Concise issue title.
        body:
          type: string
          description: Detailed issue description, reproduction steps, or context.
        category:
          type: string
          enum: [bug, ux, friction, feature_request]
          default: bug
        submit_github:
          type: boolean
          description: If true and gh CLI is available, creates a GitHub issue.
  - name: log_friction
    description: Ultra-fast append of a friction event to logs/friction.jsonl.
    parameters:
      type: object
      required: [summary]
      properties:
        summary:
          type: string
          description: Short summary of the friction or failure point.
        category:
          type: string
          default: friction
        details:
          type: string
          description: Full error message or diagnostics.
        severity:
          type: string
          enum: [low, normal, high, critical]
          default: normal
  - name: list_issues
    description: List recorded issues and friction reports.
    parameters:
      type: object
      properties:
        category:
          type: string
          description: Optional filter by category.

senses:
  - name: recent_friction
    description: Returns the latest friction events from the session log.
    cadence: 60s