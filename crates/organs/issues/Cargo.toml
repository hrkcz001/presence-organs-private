[package]
name = "organ-issues"
version = "0.3.0"
edition = "2021"
authors = ["hrkcz001"]
license = "Apache-2.0"
description = "Autonomous bug, UX friction, and GitHub telemetry reporting organ for Presence Alpha/Beta"

[dependencies]
presence-organ-sdk = { path = "../../presence-organ-sdk", version = "0.3.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3"