[package]
name = "presence-dashboard"
version = "0.3.0"
edition = "2021"
authors = ["hrkcz001"]
license = "Apache-2.0"
description = "Native non-invasive desktop tiling dashboard for Presence"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = { version = "0.29", default-features = false }
presence-organ-sdk = { path = "../presence-organ-sdk", version = "0.3.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = "0.4"