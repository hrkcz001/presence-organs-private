[package]
name = "organ-memory"
version = "0.3.0"
edition = "2021"
authors = ["hrkcz001"]
license = "Apache-2.0"
description = "Two-tier episodic and semantic memory management organ for Presence"

[dependencies]
presence-organ-sdk = { path = "../../presence-organ-sdk", version = "0.3.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3"