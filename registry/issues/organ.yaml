name: issues
version: "0.3.0"
manual: MANUAL.md
description: "Telemetry, friction logging and GitHub issue reporter organ"
instructions: "ALPHA/BETA EVALUATION DIRECTIVE: Report friction, unexpected tool behavior, or gaps immediately using log_friction or report_issue. If 'gh' is not installed, issues remain stored locally in logs/issues/."
entrypoint: "organ-issues"
type: "rust"
dependencies:
  system:
    - binary: "gh"
      optional: true
      scoop: "gh"
      nix: "gh"
      guix: "gh"
      disables_features: ["github_sync"]
senses:
  - name: recent_friction
    description: "Returns recent friction events and failure counts for the active session"
tools:
  - name: report_issue
    description: "Formats structured markdown issue report, saves locally to logs/issues/, and optionally exports to GitHub if gh is installed"
    parameters:
      type: object
      properties:
        title:
          type: string
          description: "Clear short summary of the issue or friction"
        body:
          type: string
          description: "Detailed description with steps, actual vs expected, and error traces"
        category:
          type: string
          enum: ["bug", "friction", "feature_gap", "model_limitation", "perf"]
          default: "bug"
        submit_github:
          type: boolean
          description: "Attempt export to GitHub repository issues via gh CLI (requires gh)"
          default: false
      required: ["title", "body"]
  - name: log_friction
    description: "Append zero-latency lightweight telemetry event to logs/friction.jsonl"
    parameters:
      type: object
      properties:
        category:
          type: string
          default: "friction"
        summary:
          type: string
          description: "Short line describing what went wrong or felt awkward"
        details:
          type: string
          default: ""
        severity:
          type: string
          enum: ["info", "warning", "error", "critical"]
          default: "warning"
      required: ["summary"]
  - name: list_issues
    description: "List recorded issue reports in logs/issues/"
    parameters:
      type: object
      properties:
        category:
          type: string
          default: ""
      required: []